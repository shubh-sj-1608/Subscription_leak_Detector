{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Subscription Leak Detector</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container auth-container">
        <h1>Subscription Leak Detector</h1>
        <p class="subtitle">Create an account to get started.</p>

        <div class="upload-box">
            {% if error %}<p style="color: #E24A3B;">{{ error }}</p>{% endif %}
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Choose a username" required><br><br>
                <input type="password" name="password" placeholder="Choose a password" required><br><br>
                <button type="submit">Sign Up</button>
            </form>
            <p style="margin-top: 16px;">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
        </div>
    </div>
</body>
</html>
