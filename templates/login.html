{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Subscription Leak Detector</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container auth-container">
        <h1>Subscription Leak Detector</h1>
        <p class="subtitle">Log in to see your subscriptions.</p>

        <div class="upload-box">
            {% if error %}<p style="color: #E24A3B;">{{ error }}</p>{% endif %}
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required><br><br>
                <input type="password" name="password" placeholder="Password" required><br><br>
                <button type="submit">Log In</button>
            </form>
            <p style="margin-top: 16px;">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
        </div>
    </div>
</body>
</html>
